</style>
  <meta name="application-name" content="Move Atlas Public Prototype">
</head>
<body>
  <div class="grain"></div>
  <div id="root"></div><div class="toast" id="toast"></div>
  <script>
  const DB_KEY='moveAtlasStudio_accounts_v1', SESSION_KEY='moveAtlasStudio_session_v1';
  const icons={home:'⌂',profile:'◌',roadmap:'↗',budget:'$',areas:'⌖',housing:'⌂',career:'↝',docs:'▤'};
  var defaultMove=()=>({onboarded:false,person:'',household:'Solo',origin:'',destination:'',moveType:'New chapter',date:'',timeframe:'Flexible',housingMax:2800,savings:0,moveFund:15000,priorities:['Lifestyle','Housing'],tasks:[{id:id(),title:'Clarify your non-negotiables',area:'Foundation',when:'This week',done:false},{id:id(),title:'Compare your best-fit areas',area:'Location',when:'This week',done:false},{id:id(),title:'Build a realistic move fund',area:'Finances',when:'Next up',done:false}],areas:[{id:id(),name:'Your first contender',region:'Add a city or neighborhood',score:0,notes:''}],housing:[],career:[],documents:[],budget:[{id:id(),name:'Move fund target',category:'Reserve',amount:15000},{id:id(),name:'Housing setup & deposits',category:'Housing',amount:3500},{id:id(),name:'Travel & transport',category:'Logistics',amount:2200}]});
  let state={account:null,move:null,section:'dashboard',authMode:'signin',wizardStep:0};
  function id(){return Math.random().toString(36).slice(2,10)}
  function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
  function money(n){return Number(n||0).toLocaleString('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0})}
  function dateText(v){if(!v)return 'Choose a date';let d=new Date(v+'T12:00:00');return d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}
  function accounts(){try{return JSON.parse(localStorage.getItem(DB_KEY))||[]}catch{return []}}
  function saveAccounts(a){localStorage.setItem(DB_KEY,JSON.stringify(a))}
  function persist(){let all=accounts(), i=all.findIndex(a=>a.id===state.account.id);if(i>-1){all[i].move=state.move;saveAccounts(all)}}
  function session(){try{return JSON.parse(localStorage.getItem(SESSION_KEY))}catch{return null}}
  async function digest(text){let buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(text));return [...new Uint8Array(buf)].map(v=>v.toString(16).padStart(2,'0')).join('')}
  function initials(n){return (n||'M A').split(/\s+/).map(x=>x[0]).join('').slice(0,2).toUpperCase()}
  function greeting(){let h=new Date().getHours();return h<12?'Good morning':h<18?'Good afternoon':'Good evening'}
  function showToast(msg){let t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.classList.remove('show'),2200)}
  function render(){if(!state.account)return renderAuth();if(!state.move.onboarded)return renderWizard();renderApp()}
  function renderAuth(){root.innerHTML=`<main class="auth-shell"><section class="auth-art"><div class="brand"><div class="brand-mark">M</div><div><div class="brand-name">Move Atlas</div><div class="brand-sub">Public prototype</div></div></div><div class="auth-quote"><div class="eyebrow">Loading the test workspace</div><h1>Your move, organized around real life.</h1><p>This public prototype uses browser-local test profiles and clearly labeled sample or mock data.</p></div></section><section class="auth-panel"><div class="auth-card"><div class="eyebrow">Preparing Move Atlas</div><h2>One moment…</h2><div class="prototype-warning"><b>Use fictional or approximate test data only.</b><span>No cloud sync, recovery, or secure document storage is provided.</span></div><p class="auth-foot">If this screen does not change, reload the page. Profile creation is unavailable until the complete test application has loaded.</p></div></section></main>`}
  function authTab(mode){state.authMode=mode;renderAuth()}
  function togglePassword(){let e=document.getElementById('authPassword');e.type=e.type==='password'?'text':'password'}
  function authError(t){document.getElementById('authError').innerHTML=`<div class="error">${esc(t)}</div>`}
  async function createAccount(){let name=document.getElementById('authName').value.trim(),email=document.getElementById('authEmail').value.trim().toLowerCase(),pw=document.getElementById('authPassword').value;if(!name||!email||!pw)return authError('Please complete every field.');if(!/^\S+@\S+\.\S+$/.test(email))return authError('Enter a valid email address.');if(pw.length<6)return authError('Use a password with at least 6 characters.');let all=accounts();if(all.some(a=>a.email===email))return authError('An account with that email already exists. Sign in instead.');let a={id:id(),name,email,password:await digest(pw),move:defaultMove()};all.push(a);saveAccounts(all);state.account=a;state.move=a.move;localStorage.setItem(SESSION_KEY,JSON.stringify({id:a.id}));render()}
  async function signIn(){let email=document.getElementById('authEmail').value.trim().toLowerCase(),pw=document.getElementById('authPassword').value,a=accounts().find(x=>x.email===email);if(!a||a.password!==await digest(pw))return authError('That email or password does not match this browser’s saved accounts.');state.account=a;state.move=a.move||defaultMove();localStorage.setItem(SESSION_KEY,JSON.stringify({id:a.id}));render()}
  function startDemo(){let all=accounts(),a=all.find(x=>x.email==='demo@moveatlas.local');if(!a){a={id:id(),name:'Maya Bennett',email:'demo@moveatlas.local',password:'demo',move:demoMove()};all.push(a);saveAccounts(all)}state.account=a;state.move=a.move;localStorage.setItem(SESSION_KEY,JSON.stringify({id:a.id}));render()}
  function demoMove(){let m=defaultMove();Object.assign(m,{onboarded:true,person:'Maya Bennett',household:'Couple + dog',origin:'Austin, TX',destination:'Portland, OR',moveType:'New chapter',date:'2026-10-15',timeframe:'Fall 2026',housingMax:2900,savings:8600,moveFund:18000,priorities:['Lifestyle','Career','Housing'],areas:[{id:id(),name:'Sellwood-Moreland',region:'Portland, OR',score:88,notes:'Leafy, walkable, close to the river.'},{id:id(),name:'Alberta Arts',region:'Portland, OR',score:82,notes:'Creative energy and a strong food scene.'},{id:id(),name:'Beaverton',region:'Portland, OR',score:74,notes:'More space, easy access to westside employers.'}],housing:[{id:id(),name:'2-bed near Sellwood',detail:'$2,650/mo · Tour saved',score:90},{id:id(),name:'Alberta garden unit',detail:'$2,420/mo · Watching',score:79}],career:[{id:id(),name:'Director, Brand at Field Notes',detail:'Interviewing · Portland / hybrid',score:0}],documents:[{id:id(),name:'Vet records',detail:'Ready',score:100},{id:id(),name:'Lease paperwork',detail:'In progress',score:55}],tasks:[{id:id(),title:'Shortlist three neighborhoods',area:'Location',when:'Today',done:true},{id:id(),title:'Schedule Sellwood virtual tour',area:'Housing',when:'Today',done:false},{id:id(),title:'Get an all-in moving quote',area:'Finances',when:'This week',done:false},{id:id(),title:'Review pet travel requirements',area:'Logistics',when:'Next up',done:false}],budget:[{id:id(),name:'Move fund target',category:'Reserve',amount:18000},{id:id(),name:'Housing setup & deposits',category:'Housing',amount:4200},{id:id(),name:'Moving & transport',category:'Logistics',amount:3150},{id:id(),name:'First month buffer',category:'Reserve',amount:4800}]});return m}
  const wizardSteps=[['About you','Your move deserves a point of view.'],['The move','Give your plan a horizon.'],['Your guardrails','Set up the practical decisions.'],['What matters','Tailor the recommendation engine.'],['Your map','Review your personalized move plan.']];
  function renderWizard(){let s=state.wizardStep,html='';if(s===0)html=`<div class="eyebrow">Step 1 · A little context</div><h1>Who are we planning this move for?</h1><p class="lead">The more personal the starting point, the more useful your roadmap becomes.</p><div class="two-col"><div class="field"><label>Your name</label><input id="wPerson" value="${esc(state.move.person)}" placeholder="e.g. Jordan Lee"></div><div class="field"><label>Who is moving?</label><select id="wHousehold">${['Solo','Couple','Family','Couple + pet','Family + pets','Roommates'].map(v=>`<option ${v===state.move.household?'selected':''}>${v}</option>`).join('')}</select></div></div>`;if(s===1)html=`<div class="eyebrow">Step 2 · Direction & timing</div><h1>Where are you heading—and when?</h1><p class="lead">This does not need to be final. We’ll use it to create a decision path with the right amount of urgency.</p><div class="two-col"><div class="field"><label>Current city or region</label><input id="wOrigin" value="${esc(state.move.origin)}" placeholder="e.g. Chicago, IL"></div><div class="field"><label>Destination or shortlist</label><input id="wDestination" value="${esc(state.move.destination)}" placeholder="e.g. Portland, OR"></div><div class="field"><label>Move type</label><select id="wMoveType">${['New chapter','Job relocation','Closer to family','A trial move','School / study','International move'].map(v=>`<option ${v===state.move.moveType?'selected':''}>${v}</option>`).join('')}</select></div><div class="field"><label>Ideal move date</label><input id="wDate" type="date" value="${esc(state.move.date)}"></div></div>`;if(s===2)html=`<div class="eyebrow">Step 3 · Financial comfort zone</div><h1>Build the guardrails before the wish list.</h1><p class="lead">A strong plan protects your future self. These are editable estimates—not a promise.</p><div class="two-col"><div class="field"><label>Maximum monthly housing</label><input id="wHousing" type="number" value="${state.move.housingMax}" min="0" step="100"></div><div class="field"><label>Cash available for the move</label><input id="wSavings" type="number" value="${state.move.savings}" min="0" step="100"></div><div class="field"><label>Comfortable move-fund target</label><input id="wFund" type="number" value="${state.move.moveFund}" min="0" step="100"></div><div class="field"><label>Planning rhythm</label><select id="wTimeframe">${['As soon as possible','Next 3 months','This year','Flexible'].map(v=>`<option ${v===state.move.timeframe?'selected':''}>${v}</option>`).join('')}</select></div></div>`;if(s===3){let choices=[['Lifestyle','☀','A better everyday rhythm'],['Career','↝','Work that opens doors'],['Housing','⌂','A place that feels right'],['Community','◌','People and connection'],['Nature','⌖','More room to breathe'],['Cost','$', 'Financial ease']];html=`<div class="eyebrow">Step 4 · Personalization</div><h1>What will make this move feel worth it?</h1><p class="lead">Choose up to three priorities. We’ll use them to guide your research and surface the right next actions.</p><div class="choice-grid">${choices.map(([n,i,d])=>`<div class="choice ${state.move.priorities.includes(n)?'selected':''}" onclick="togglePriority('${n}',this)"><span class="choice-icon">${i}</span><strong>${n}</strong><span>${d}</span></div>`).join('')}</div><p style="font-size:12px;color:var(--muted);margin:16px 0 0">Selected: <span id="priorityCount">${state.move.priorities.length}</span> of 3</p>`}if(s===4){let readiness=baseReadiness();html=`<div class="eyebrow">Step 5 · Your tailored plan</div><h1>Here’s the shape of your move.</h1><p class="lead">You can change every detail later. For now, this gives you a composed place to begin.</p><div class="setup-summary"><div><div class="eyebrow">${esc(state.move.moveType)}</div><h3>${esc(state.move.origin||'Your starting point')} <span style="color:var(--leaf)">→</span> ${esc(state.move.destination||'Your next place')}</h3><div class="summary-list"><div><b>Household</b> ${esc(state.move.household)}</div><div><b>Target</b> ${dateText(state.move.date)}</div><div><b>Move fund</b> ${money(state.move.moveFund)}</div><div><b>Priorities</b> ${state.move.priorities.join(' · ')||'To be explored'}</div></div></div><div class="compass"><strong>${readiness}%</strong><small>starting clarity</small></div></div><div class="card" style="margin-top:16px;padding:17px"><div class="card-head"><div><h3>Your first three moves</h3><p>A steady sequence beats trying to solve everything at once.</p></div></div><div class="next-list"><div class="next"><div class="status-dot">1</div><div><strong>Define your personal non-negotiables</strong><span>Build a filter for every future decision.</span></div></div><div class="next"><div class="status-dot">2</div><div><strong>Explore your best-fit areas</strong><span>Start collecting evidence, not just inspiration.</span></div></div><div class="next"><div class="status-dot">3</div><div><strong>Pressure-test your move fund</strong><span>Make a calm, well-resourced landing possible.</span></div></div></div></div>`}root.innerHTML=`<main class="wizard"><aside class="wizard-aside"><div class="brand"><div class="brand-mark">M</div><div><div class="brand-name">Move Atlas</div><div class="brand-sub">Your relocation studio</div></div></div><h2>Let’s make a beautiful plan.</h2><p>Five thoughtful prompts. One clear place to begin.</p><div class="steps">${wizardSteps.map((x,i)=>`<div class="step ${i===s?'current':''} ${i<s?'done':''}"><span class="dot">${i<s?'✓':i+1}</span>${x[0]}</div>`).join('')}</div><div class="wizard-note"><strong>Your workspace is private.</strong>Every detail is saved locally to this device as you go.</div></aside><section class="wizard-main"><div class="wizard-card">${html}<div class="wizard-actions"><div>${s?'<button class="button ghost" onclick="wizardBack()">← Back</button>':'<span class="step-count">Welcome, let’s begin</span>'}</div><div>${s===4?'<button class="button lime" onclick="finishSetup()">Open my move studio →</button>':'<button class="button" onclick="wizardNext()">Continue →</button>'}</div></div></div></section></main>`}
  function saveWizardFields(){let m=state.move,s=state.wizardStep;if(s===0){m.person=document.getElementById('wPerson').value.trim();m.household=document.getElementById('wHousehold').value}if(s===1){m.origin=document.getElementById('wOrigin').value.trim();m.destination=document.getElementById('wDestination').value.trim();m.moveType=document.getElementById('wMoveType').value;m.date=document.getElementById('wDate').value}if(s===2){m.housingMax=+document.getElementById('wHousing').value||0;m.savings=+document.getElementById('wSavings').value||0;m.moveFund=+document.getElementById('wFund').value||0;m.timeframe=document.getElementById('wTimeframe').value;m.budget[0].amount=m.moveFund}persist()}
  function wizardNext(){if(state.wizardStep===0&&!document.getElementById('wPerson').value.trim())return showToast('Tell us what to call you first.');saveWizardFields();state.wizardStep++;renderWizard()}function wizardBack(){saveWizardFields();state.wizardStep--;renderWizard()}function togglePriority(n,el){let a=state.move.priorities;if(a.includes(n))a.splice(a.indexOf(n),1);else if(a.length<3)a.push(n);else return showToast('Choose up to three priorities.');el.classList.toggle('selected');document.getElementById('priorityCount').textContent=a.length;persist()}function finishSetup(){state.move.onboarded=true;persist();render();showToast('Your move studio is ready.')}
  function baseReadiness(){let m=state.move,score=12;if(m.origin&&m.destination)score+=13;if(m.date)score+=8;if(m.housingMax)score+=7;if(m.savings/m.moveFund>=.5)score+=10;if(m.priorities.length)score+=10;score+=Math.min(20,m.tasks.filter(x=>x.done).length*8);score+=Math.min(15,m.areas.filter(x=>x.score>0).length*6);score+=Math.min(5,m.housing.length*3);return Math.min(100,score)}
  function navItems(){return [['dashboard','home','Overview'],['profile','profile','My move'],['roadmap','roadmap','Roadmap'],['budget','budget','Budget'],['areas','areas','Area finder'],['housing','housing','Homes'],['career','career','Career'],['documents','docs','Documents']]}
  function renderApp(){let m=state.move,active=state.section,ready=baseReadiness(),first=(m.person||state.account.name||'there').split(' ')[0];root.innerHTML=`<div class="app"><aside class="sidebar"><div class="brand"><div class="brand-mark">M</div><div><div class="brand-name">Move Atlas</div><div class="brand-sub">Relocation studio</div></div></div><div class="workspace">Your workspace</div><nav class="nav">${navItems().map(([s,i,l])=>`<button class="${s===active?'active':''}" onclick="go('${s}')"><span class="nav-icon">${icons[i]}</span>${l}</button>`).join('')}</nav><div class="side-bottom"><div class="readiness-mini"><header><span>Move readiness</span><b>${ready}%</b></header><div class="meter"><i style="width:${ready}%"></i></div></div><div class="account-menu"><div class="avatar">${initials(state.account.name)}</div><div class="who"><b>${esc(state.account.name)}</b><span>${esc(state.account.email)}</span></div><button title="Sign out" onclick="signOut()">↗</button></div></div></aside><main class="main"><header class="topbar"><div class="mobile-brand brand"><div class="brand-mark">M</div><div class="brand-name">Move Atlas</div></div><div class="crumb">${active==='dashboard'?'Your relocation studio':navItems().find(x=>x[0]===active)[2]}</div><div class="top-actions"><span class="help">Need a fresh perspective?</span><button class="button small secondary" onclick="openQuickAdd()">＋ Add</button></div></header><div class="page">${page(active,first,ready)}</div></main><nav class="mobile-nav">${navItems().slice(0,5).map(([s,i,l])=>`<button class="${s===active?'active':''}" onclick="go('${s}')"><span>${icons[i]}</span>${l}</button>`).join('')}</nav></div>`}
  function page(s,first,ready){let content={dashboard:dashboardPage(first,ready),profile:profilePage(),roadmap:roadmapPage(),budget:budgetPage(),areas:collectionPage('areas','Area finder','Build a shortlist with evidence, not just a good feeling.','Add area'),housing:collectionPage('housing','Homes','Save options that make your landing feel possible.','Add home'),career:collectionPage('career','Career','Keep income and opportunity in view as the move takes shape.','Add opportunity'),documents:collectionPage('documents','Documents','The invisible details, stored where you can find them.','Add document')};return `<section class="section active">${content[s]}</section>`}
  function dashboardPage(first,ready){let m=state.move,done=m.tasks.filter(x=>x.done).length,top=m.areas.filter(x=>x.score).sort((a,b)=>b.score-a.score)[0],days=m.date?Math.max(0,Math.ceil((new Date(m.date+'T12:00:00')-Date.now())/86400000)):null;return`<div class="page-head"><div><div class="eyebrow">${greeting()}, ${esc(first)}</div><h1>Make the next place feel like yours.</h1><p>One composed view of the decisions that matter right now—so your move gains momentum without taking over your life.</p></div></div><section class="dashboard-hero"><div><div class="eyebrow">Your move at a glance</div><h2>${esc(m.origin||'Your current home')} <span style="color:var(--lime)">→</span> ${esc(m.destination||'a place to discover')}</h2><p>${m.moveType} · ${m.household} · ${m.date?dateText(m.date):m.timeframe}</p><div class="route"><span>${esc(m.origin||'HERE')}</span><i class="line"></i><span>${esc(m.destination||'NEXT')}</span></div></div><div class="hero-right"><div class="ready-label">Move readiness</div><div class="readiness-big"><b>${ready}%</b><span>of your plan<br>is taking shape</span></div><div class="meter"><i style="width:${ready}%"></i></div><div class="tip"><strong>${ready<50?'The clearest next action:':'You’re building real momentum:'}</strong> ${nextTip()}</div></div></section><section class="dashboard-grid"><article class="card"><div class="card-head"><div><h3>Your next decisive moves</h3><p>Small, specific actions with outsized payoff.</p></div><button class="quiet-link" onclick="go('roadmap')">View roadmap →</button></div><div class="next-list">${m.tasks.slice(0,4).map((t,i)=>`<div class="next ${t.done?'done':''}"><div class="status-dot">${t.done?'✓':i+1}</div><div><strong>${esc(t.title)}</strong><span>${esc(t.area)} · ${esc(t.when)}</span></div><button onclick="toggleTask('${t.id}')">${t.done?'Reopen':'Complete'}</button></div>`).join('')}</div></article><aside class="card"><div class="card-head"><div><h3>The essential numbers</h3><p>Gentle guardrails for a calm landing.</p></div></div><div class="glance"><div class="metric"><label>Move fund</label><strong>${money(m.savings)}</strong><span>of ${money(m.moveFund)} saved</span></div><div class="metric"><label>Housing max</label><strong>${money(m.housingMax)}</strong><span>per month</span></div><div class="metric"><label>Target</label><strong>${days!==null?days:'—'}</strong><span>${days!==null?'days away':m.timeframe}</span></div><div class="metric"><label>Top area</label><strong>${top?top.score:'—'}</strong><span>${top?esc(top.name):'Still exploring'}</span></div></div></aside></section><section class="priority-strip">${priorityCards()}</section><section class="dashboard-grid"><article class="card"><div class="card-head"><div><h3>Decision horizon</h3><p>A sane sequence for the weeks ahead.</p></div></div><div class="timeline"><div class="timeline-item"><div class="when">NOW</div><div class="rail"></div><div><strong>Define your filters</strong><span>Know what is worth optimizing for before you compare.</span></div></div><div class="timeline-item"><div class="when">NEXT</div><div class="rail"></div><div><strong>Validate your top areas</strong><span>Research the ordinary Tuesday, not just the highlights.</span></div></div><div class="timeline-item"><div class="when">THEN</div><div class="rail"></div><div><strong>Make the commitment easy</strong><span>Line up budget, housing, and move-day logistics.</span></div></div></div></article><aside class="card"><div class="card-head"><div><h3>A note from your atlas</h3></div></div><p style="font:600 23px/1.25 var(--serif);letter-spacing:-.03em;margin:0">“A good move is less about finding the perfect answer, and more about making a choice you can stand behind.”</p><p style="font-size:12px;color:var(--muted);margin:14px 0 0">You have ${done} of ${m.tasks.length} foundational actions complete.</p></aside></section>`}
  function nextTip(){let t=state.move.tasks.find(x=>!x.done);return t?`Finish “${t.title}.”`:'Your foundation is complete—start adding your real options.'}
  function priorityCards(){let all=[['☀','Lifestyle','How do you want ordinary days to feel?'],['↝','Career','Keep opportunity in the frame.'],['⌂','Housing','Balance the must-haves with the numbers.'],['⌖','Place','Look beyond the highlight reel.']];return all.map(([i,t,d])=>`<article class="priority"><div class="p-icon">${i}</div><b>${t}</b><span>${d}</span></article>`).join('')}
  function profilePage(){let m=state.move;return`<div class="page-head"><div><div class="eyebrow">Your north star</div><h1>My move</h1><p>The working brief behind every recommendation and decision.</p></div><button class="button secondary" onclick="editProfile()">Edit move brief</button></div><div class="profile-layout"><article class="card"><div class="card-head"><div><h3>The brief</h3><p>The facts that anchor your plan.</p></div></div>${[['Moving from',m.origin||'Not set'],['Moving toward',m.destination||'Still exploring'],['Move type',m.moveType],['Household',m.household],['Ideal timing',m.date?dateText(m.date):m.timeframe],['Housing ceiling',money(m.housingMax)+'/mo'],['Move fund',money(m.moveFund)],['Saved so far',money(m.savings)]].map(x=>`<div class="info-row"><label>${x[0]}</label><b>${esc(x[1])}</b></div>`).join('')}</article><aside class="card"><div class="card-head"><div><h3>What matters most</h3><p>Your current decision filters.</p></div></div><div class="decision-list">${m.priorities.map((x,i)=>`<div class="decision"><b>0${i+1} · ${esc(x)}</b><span>${priorityDescription(x)}</span></div>`).join('')||'<div class="empty-state">Choose priorities in the move brief.</div>'}</div></aside></div>`}
  function priorityDescription(x){return {Lifestyle:'A move should improve the texture of everyday life.',Career:'Opportunity should travel with you.',Housing:'Home must support the life you are building.',Community:'Connection is part of feeling at home.',Nature:'Access to the outdoors changes the rhythm of a week.',Cost:'Your plan should leave room to breathe.'}[x]||''}
  function roadmapPage(){let m=state.move;return`<div class="page-head"><div><div class="eyebrow">A clear sequence</div><h1>Your roadmap</h1><p>A practical path from possibility to a confident move.</p></div><button class="button" onclick="openTask()">＋ Add action</button></div><div class="profile-layout"><article class="card"><div class="card-head"><div><h3>Foundation actions</h3><p>Complete these in the order that removes uncertainty.</p></div></div><div class="roadmap">${m.tasks.map((t,i)=>`<div class="roadmap-step ${t.done?'done':''}"><div class="n">${t.done?'✓':i+1}</div><div style="flex:1"><strong>${esc(t.title)}</strong><span>${esc(t.area)} · ${esc(t.when)}</span></div><button class="button small secondary" onclick="toggleTask('${t.id}')">${t.done?'Undo':'Done'}</button></div>`).join('')}</div></article><aside class="card"><div class="card-head"><div><h3>Build momentum</h3><p>Finish one category before opening another.</p></div></div><div class="decision-list"><div class="decision"><b>01 · Find the fit</b><span>Clarify your priorities and compare areas on your terms.</span></div><div class="decision"><b>02 · Validate the math</b><span>Hold the budget, income, and housing ceiling together.</span></div><div class="decision"><b>03 · Make the landing</b><span>Line up logistics, documents, and your first month.</span></div></div></aside></div>`}
  function budgetPage(){let m=state.move,total=m.budget.reduce((s,x)=>s+Number(x.amount||0),0),gap=Math.max(0,total-m.savings),cover=Math.min(100,Math.round(m.savings/(total||1)*100));return`<div class="page-head"><div><div class="eyebrow">Financial ease</div><h1>Budget</h1><p>Turn unknowns into a plan with room for real life.</p></div><button class="button" onclick="openBudget()">＋ Add line item</button></div><div class="profile-layout"><article class="card"><div class="budget-total"><small>Estimated move reserve</small><b>${money(total)}</b><span>${money(m.savings)} saved · ${money(gap)} remaining to cover</span><div class="meter" style="margin-top:14px"><i style="width:${cover}%"></i></div></div><div style="margin-top:15px">${m.budget.map(x=>`<div class="budget-line"><div><b>${esc(x.name)}</b><span style="display:block;font-size:11px">${esc(x.category)}</span></div><b>${money(x.amount)}</b></div>`).join('')}</div></article><aside class="card"><div class="card-head"><div><h3>Your comfort line</h3><p>A few values to protect while you search.</p></div></div><div class="metric" style="margin-bottom:10px"><label>Housing ceiling</label><strong>${money(m.housingMax)}</strong><span>per month, all in if possible</span></div><div class="metric"><label>Fund coverage</label><strong>${cover}%</strong><span>of your working reserve</span></div><p style="font-size:12px;color:var(--muted);margin:16px 0 0">Tip: A little more buffer creates a lot more choice when listings and moving quotes arrive.</p></aside></div>`}
  function collectionPage(type,title,subtitle,action){let arr=state.move[type],isArea=type==='areas';return`<div class="page-head"><div><div class="eyebrow">Your evidence library</div><h1>${title}</h1><p>${subtitle}</p></div><button class="button" onclick="openRecord('${type}')">＋ ${action}</button></div>${arr.length?`<div class="data-grid">${arr.map(x=>`<article class="data-card"><div class="card-head"><div><h3>${esc(x.name)}</h3><p>${esc(x.region||x.detail||x.notes||'Saved for review')}</p></div>${x.score?`<div class="score">${x.score}<small>/100</small></div>`:'<span class="pill">Saved</span>'}</div>${isArea?`<div class="compare-row"><span>Fit score</span><div style="display:flex;gap:9px;align-items:center"><div class="progress" style="width:80px"><i style="width:${x.score}%"></i></div><b>${x.score||'—'}</b></div></div><div class="compare-row"><span>Why it stands out</span><b style="max-width:55%;text-align:right">${esc(x.notes||'Add your notes')}</b></div>`:`<div class="compare-row"><span>Status</span><span class="pill ${x.detail?.toLowerCase().includes('progress')?'warm':''}">${esc(x.detail||'For review')}</span></div><div class="compare-row"><span>Workspace</span><b>${type==='housing'?'Housing':'Research'}</b></div>`}<button class="quiet-link" style="margin-top:15px" onclick="deleteRecord('${type}','${x.id}')">Remove</button></article>`).join('')}</div>`:`<div class="card empty-state"><span class="empty-icon">${type==='areas'?'⌖':type==='housing'?'⌂':type==='career'?'↝':'▤'}</span><h3>Start with one good option.</h3><p>${subtitle}</p><button class="button small" style="margin-top:12px" onclick="openRecord('${type}')">${action}</button></div>`}`}
  function go(s){state.section=s;renderApp();window.scrollTo({top:0,behavior:'smooth'})}function toggleTask(i){let t=state.move.tasks.find(x=>x.id===i);t.done=!t.done;persist();renderApp();showToast(t.done?'Action complete. Nicely done.':'Action reopened.')}
  function signOut(){localStorage.removeItem(SESSION_KEY);state={account:null,move:null,section:'dashboard',authMode:'signin',wizardStep:0};render()}
  function modal(title,body){document.body.insertAdjacentHTML('beforeend',`<div class="modal-backdrop" id="modalBack"><div class="modal"><div class="modal-head"><h2>${title}</h2><button onclick="closeModal()">×</button></div>${body}</div></div>`)}function closeModal(){document.getElementById('modalBack')?.remove()}
  function openQuickAdd(){modal('Add to your workspace',`<div class="choice-grid"><div class="choice" onclick="closeModal();openTask()"><span class="choice-icon">✓</span><strong>Action</strong><span>Add a roadmap task</span></div><div class="choice" onclick="closeModal();openBudget()"><span class="choice-icon">$</span><strong>Budget line</strong><span>Capture a cost</span></div><div class="choice" onclick="closeModal();openRecord('areas')"><span class="choice-icon">⌖</span><strong>Area</strong><span>Save a contender</span></div><div class="choice" onclick="closeModal();openRecord('housing')"><span class="choice-icon">⌂</span><strong>Home</strong><span>Keep a listing</span></div></div>`)}
  function openTask(){modal('Add an action',`<div class="field"><label>Action</label><input id="addName" placeholder="e.g. Request moving quotes"></div><div class="two-col"><div class="field"><label>Category</label><select id="addArea"><option>Foundation</option><option>Location</option><option>Housing</option><option>Finances</option><option>Career</option><option>Logistics</option></select></div><div class="field"><label>When</label><select id="addWhen"><option>This week</option><option>Next up</option><option>Before moving</option></select></div></div><button class="button full" onclick="saveTask()">Save action</button>`)}function saveTask(){let n=document.getElementById('addName').value.trim();if(!n)return showToast('Add a specific action first.');state.move.tasks.push({id:id(),title:n,area:document.getElementById('addArea').value,when:document.getElementById('addWhen').value,done:false});persist();closeModal();renderApp();showToast('Action added.')}
  function openBudget(){modal('Add a budget line',`<div class="field"><label>What are you planning for?</label><input id="addName" placeholder="e.g. Storage for one month"></div><div class="two-col"><div class="field"><label>Category</label><select id="addCategory"><option>Reserve</option><option>Housing</option><option>Logistics</option><option>Travel</option><option>Admin</option></select></div><div class="field"><label>Estimated cost</label><input id="addAmount" type="number" placeholder="0"></div></div><button class="button full" onclick="saveBudget()">Add to budget</button>`)}function saveBudget(){let n=document.getElementById('addName').value.trim(),a=+document.getElementById('addAmount').value;if(!n)return showToast('Give this line item a name.');state.move.budget.push({id:id(),name:n,category:document.getElementById('addCategory').value,amount:a});persist();closeModal();renderApp();showToast('Budget updated.')}
  function openRecord(type){let labels={areas:['Area or neighborhood','City / region','What makes it promising?','Fit score (0–100)'],housing:['Listing or home name','Key details','', ''],career:['Role or opportunity','Company / status','', ''],documents:['Document name','Status or notes','', '']}[type];let extra=type==='areas'?`<div class="field"><label>${labels[2]}</label><textarea id="addNotes" placeholder="Walkability, commute, feeling, deal-breakers…"></textarea></div><div class="field"><label>${labels[3]}</label><input id="addScore" type="number" min="0" max="100" placeholder="75"></div>`:`<div class="field"><label>${labels[1]}</label><input id="addDetail" placeholder="e.g. $2,500/mo · Tour Friday"></div>`;modal(`Add ${type==='areas'?'an area':type==='housing'?'a home':type==='career'?'an opportunity':'a document'}`,`<div class="field"><label>${labels[0]}</label><input id="addName" placeholder="Be specific so future you is grateful"></div>${type==='areas'?`<div class="field"><label>${labels[1]}</label><input id="addRegion" placeholder="e.g. Portland, OR"></div>`:''}${extra}<button class="button full" onclick="saveRecord('${type}')">Save to workspace</button>`)}function saveRecord(type){let n=document.getElementById('addName').value.trim();if(!n)return showToast('Start with a clear name.');let o={id:id(),name:n};if(type==='areas')Object.assign(o,{region:document.getElementById('addRegion').value.trim(),notes:document.getElementById('addNotes').value.trim(),score:+document.getElementById('addScore').value||0});else o.detail=document.getElementById('addDetail').value.trim();state.move[type].push(o);persist();closeModal();renderApp();showToast('Saved to your workspace.')}
  function deleteRecord(type,i){state.move[type]=state.move[type].filter(x=>x.id!==i);persist();renderApp();showToast('Removed.')}
  function editProfile(){let m=state.move;modal('Edit your move brief',`<div class="two-col"><div class="field"><label>Moving from</label><input id="pOrigin" value="${esc(m.origin)}"></div><div class="field"><label>Moving toward</label><input id="pDestination" value="${esc(m.destination)}"></div><div class="field"><label>Ideal move date</label><input id="pDate" type="date" value="${esc(m.date)}"></div><div class="field"><label>Household</label><input id="pHousehold" value="${esc(m.household)}"></div><div class="field"><label>Monthly housing max</label><input id="pHousing" type="number" value="${m.housingMax}"></div><div class="field"><label>Move fund target</label><input id="pFund" type="number" value="${m.moveFund}"></div><div class="field"><label>Saved now</label><input id="pSavings" type="number" value="${m.savings}"></div></div><button class="button full" onclick="saveProfile()">Save move brief</button>`)}function saveProfile(){let m=state.move;m.origin=document.getElementById('pOrigin').value.trim();m.destination=document.getElementById('pDestination').value.trim();m.date=document.getElementById('pDate').value;m.household=document.getElementById('pHousehold').value.trim();m.housingMax=+document.getElementById('pHousing').value||0;m.moveFund=+document.getElementById('pFund').value||0;m.savings=+document.getElementById('pSavings').value||0;m.budget[0].amount=m.moveFund;persist();closeModal();renderApp();showToast('Move brief updated.')}
  (function boot(){let s=session();if(s){let a=accounts().find(x=>x.id===s.id);if(a){state.account=a;state.move=a.move||defaultMove()}}render()})();
  </script>
  <style>

etric-line span{display:block;font:9px var(--mono);text-transform:uppercase;color:var(--muted);letter-spacing:.06em}.metric-line b{font-size:12px;margin-top:3px;display:block}.weight-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.weight-card{border:1px solid var(--line);border-radius:14px;padding:12px;background:#fff}.weight-card label{font-size:11px;font-weight:700;display:block}.weight-card span{font:10px var(--mono);color:var(--leaf)}.property-chips{display:flex;gap:7px;flex-wrap:wrap}.property-chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 10px;font-size:11px;color:var(--ink-2);cursor:pointer}.property-chip.selected{border-color:var(--leaf);background:#edf5e8;color:var(--evergreen);font-weight:700}.feature-list{display:grid;gap:1px}.feature-row{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);font-size:12px}.feature-row span{color:var(--muted)}.housing-kind{font:10px var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--leaf);margin-bottom:5px}.data-note{font-size:11px;color:var(--muted);line-height:1.45;padding:12px 0 0}.stat-callout{background:#f7eee6;border-radius:14px;padding:14px}.stat-callout b{font:600 24px var(--serif);display:block}.stat-callout span{font-size:11px;color:var(--ink-2)}
    @media(max-width:900px){.source-grid{grid-template-columns:1fr 1fr}.rank-card{grid-template-columns:43px 1fr}.rank-score{grid-column:2;text-align:left;display:flex;align-items:baseline;gap:8px}.rank-score small{margin:0}.metric-lines,.weight-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.source-grid{grid-template-columns:1fr}.rank-card{padding:14px;gap:10px}.source-banner{padding:13px}.metric-lines{grid-template-columns:1fr 1fr}}

  <script>
  /* v3: needs-aware setup, universal property tracker, and transparent area intelligence */
  const ATX_STEPS=[['You','A personal starting point'],['Direction','A destination to explore'],['Property path','Every kind of home, on your terms'],['Home needs','The things that make a place work'],['Daily life','How you need to get around'],['Ranking lens','What should shape the shortlist?'],['Your studio','A plan made for you']];
  const ATX_TYPES=['Apartment','Condo','Townhome','Single-family home','Duplex / multi-family','Room / co-living','Land / custom build','Temporary stay'];
  const ATX_FIPS={AL:'01',AK:'02',AZ:'04',AR:'05',CA:'06',CO:'08',CT:'09',DE:'10',FL:'12',GA:'13',HI:'15',ID:'16',IL:'17',IN:'18',IA:'19',KS:'20',KY:'21',LA:'22',ME:'23',MD:'24',MA:'25',MI:'26',MN:'27',MS:'28',MO:'29',MT:'30',NE:'31',NV:'32',NH:'33',NJ:'34',NM:'35',NY:'36',NC:'37',ND:'38',OH:'39',OK:'40',OR:'41',PA:'42',RI:'44',SC:'45',SD:'46',TN:'47',TX:'48',UT:'49',VT:'50',VA:'51',WA:'53',WV:'54',WI:'55',WY:'56',DC:'11'};
  function atxClamp(n,a=0,b=100){return Math.max(a,Math.min(b,Math.round(Number(n)||0)))}
  function normalizeMove(m){if(!m)return;m.propertyTypes=Array.isArray(m.propertyTypes)&&m.propertyTypes.length?m.propertyTypes:['Apartment','Townhome'];m.housingIntent=m.housingIntent||'Rent';m.bedrooms=m.bedrooms||'Any';m.bathrooms=m.bathrooms||'Any';m.pets=m.pets||'No pets';m.accessibility=m.accessibility||'No special requirements';m.commuteMode=m.commuteMode||'Flexible';m.commuteMinutes=Number(m.commuteMinutes||30);m.dailyNeeds=Array.isArray(m.dailyNeeds)?m.dailyNeeds:['Walkability'];m.rankWeights={housing:30,safety:25,mobility:20,market:15,lifestyle:10,...(m.rankWeights||{})};m.dataKeys={census:'',hud:'',fbi:'',routes:'',...(m.dataKeys||{})};m.areas=(m.areas||[]).map(a=>{a.official={census:null,hud:null,fbi:null,mobility:null,market:null,sources:[],...(a.official||{})};a.localScore=Number(a.localScore??a.score??50);return a});m.housing=(m.housing||[]).map(x=>({propertyType:x.propertyType||'Home',intent:x.intent||m.housingIntent,price:x.price||'',beds:x.beds||'',baths:x.baths||'',commute:x.commute||'',...x}));}
  defaultMove=()=>{let m={onboarded:false,person:'',household:'Solo',origin:'',destination:'',moveType:'New chapter',date:'',timeframe:'Flexible',housingMax:2800,savings:0,moveFund:15000,priorities:['Lifestyle','Housing'],propertyTypes:['Apartment','Townhome'],housingIntent:'Rent',bedrooms:'Any',bathrooms:'Any',pets:'No pets',accessibility:'No special requirements',commuteMode:'Flexible',commuteMinutes:30,dailyNeeds:['Walkability'],rankWeights:{housing:30,safety:25,mobility:20,market:15,lifestyle:10},dataKeys:{census:'',hud:'',fbi:'',routes:''},tasks:[],areas:[],housing:[],career:[],documents:[],budget:[]};m.tasks=[{id:id(),title:'Create your non-negotiables list',area:'Foundation',when:'This week',done:false},{id:id(),title:'Compare two best-fit areas',area:'Location',when:'This week',done:false},{id:id(),title:'Build your real move reserve',area:'Finances',when:'Next up',done:false}];m.budget=[{id:id(),name:'Move fund target',category:'Reserve',amount:15000},{id:id(),name:'Housing setup & deposits',category:'Housing',amount:3500},{id:id(),name:'Travel & transport',category:'Logistics',amount:2200}];return m}
  function render(){if(!state.account)return renderAuth();normalizeMove(state.move);if(!state.move.onboarded)return renderWizard();renderApp()}
  function renderWizard(){normalizeMove(state.move);let m=state.move,s=state.wizardStep,html='';if(s===0)html=`<div class="eyebrow">Step 1 · Your move begins here</div><h1>Who are we planning this move for?</h1><p class="lead">We’ll create a workspace around the real people, routines, and responsibilities making this decision.</p><div class="two-col"><div class="field"><label>Your name</label><input id="wPerson" value="${esc(m.person)}" placeholder="e.g. Jordan Lee"></div><div class="field"><label>Who is moving?</label><select id="wHousehold">${['Solo','Couple','Family','Couple + pet','Family + pets','Roommates'].map(v=>`<option ${v===m.household?'selected':''}>${v}</option>`).join('')}</select></div><div class="field"><label>Pets</label><select id="wPets"><option ${m.pets==='No pets'?'selected':''}>No pets</option><option ${m.pets==='One pet'?'selected':''}>One pet</option><option ${m.pets==='Multiple pets'?'selected':''}>Multiple pets</option><option ${m.pets==='Service / support animal'?'selected':''}>Service / support animal</option></select></div><div class="field"><label>Move type</label><select id="wMoveType">${['New chapter','Job relocation','Closer to family','A trial move','School / study','International move'].map(v=>`<option ${v===m.moveType?'selected':''}>${v}</option>`).join('')}</select></div></div>`;
  if(s===1)html=`<div class="eyebrow">Step 2 · Direction & timing</div><h1>What does the next place look like?</h1><p class="lead">Use a specific city or a working shortlist. Your decisions can evolve without losing the plan.</p><div class="two-col"><div class="field"><label>Current city or region</label><input id="wOrigin" value="${esc(m.origin)}" placeholder="e.g. Chicago, IL"></div><div class="field"><label>Destination or shortlist</label><input id="wDestination" value="${esc(m.destination)}" placeholder="e.g. Portland, OR"></div><div class="field"><label>Ideal move date</label><input id="wDate" type="date" value="${esc(m.date)}"></div><div class="field"><label>Planning rhythm</label><select id="wTimeframe">${['As soon as possible','Next 3 months','This year','Flexible'].map(v=>`<option ${v===m.timeframe?'selected':''}>${v}</option>`).join('')}</select></div></div>`;
  if(s===2)html=`<div class="eyebrow">Step 3 · Your property path</div><h1>What kinds of places belong in your search?</h1><p class="lead">Atlas is built for every path: renting, buying, a temporary landing, or a mix while you decide.</p><div class="field"><label>Primary intention</label><select id="wIntent"><option ${m.housingIntent==='Rent'?'selected':''}>Rent</option><option ${m.housingIntent==='Buy'?'selected':''}>Buy</option><option ${m.housingIntent==='Explore both'?'selected':''}>Explore both</option><option ${m.housingIntent==='Temporary first'?'selected':''}>Temporary first</option></select></div><label style="margin-top:10px">Property types you’d consider</label><div class="property-chips">${ATX_TYPES.map(t=>`<button class="property-chip ${m.propertyTypes.includes(t)?'selected':''}" onclick="atxToggle('propertyTypes','${t}',this)">${t}</button>`).join('')}</div><p class="data-note">Select every option that could work. Your Homes & Rentals page will be tailored to these choices.</p>`;
  if(s===3)html=`<div class="eyebrow">Step 4 · The everyday fit</div><h1>What should a home make easier?</h1><p class="lead">The goal isn’t just a place to live. It’s a place that supports your actual life.</p><div class="two-col"><div class="field"><label>Maximum monthly housing</label><input id="wHousing" type="number" value="${m.housingMax}" min="0" step="100"></div><div class="field"><label>Cash available for the move</label><input id="wSavings" type="number" value="${m.savings}" min="0" step="100"></div><div class="field"><label>Comfortable move-fund target</label><input id="wFund" type="number" value="${m.moveFund}" min="0" step="100"></div><div class="field"><label>Bedrooms</label><select id="wBeds">${['Any','Studio','1+','2+','3+','4+'].map(x=>`<option ${x===m.bedrooms?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Bathrooms</label><select id="wBaths">${['Any','1+','1.5+','2+','3+'].map(x=>`<option ${x===m.bathrooms?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Accessibility / mobility</label><select id="wAccess">${['No special requirements','Step-free entry','Elevator access','Single-level living','Accessible parking'].map(x=>`<option ${x===m.accessibility?'selected':''}>${x}</option>`).join('')}</select></div></div>`;
  if(s===4)html=`<div class="eyebrow">Step 5 · Daily life & mobility</div><h1>How should your new area work on a Tuesday?</h1><p class="lead">We’ll use this to interpret mobility, commute, and lifestyle signals in your area ranking.</p><div class="two-col"><div class="field"><label>Typical way you get around</label><select id="wCommuteMode">${['Drive most places','Transit-first','Walk / bike first','Hybrid commute','Flexible'].map(x=>`<option ${x===m.commuteMode?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Maximum one-way commute (minutes)</label><input id="wCommuteMinutes" type="number" min="0" max="180" value="${m.commuteMinutes}"></div></div><label style="margin-top:8px">Daily-life essentials</label><div class="property-chips">${['Walkability','Parks & outdoors','Restaurants & culture','Quiet streets','Transit access','Airport access','Healthcare nearby','Good internet'].map(x=>`<button class="property-chip ${m.dailyNeeds.includes(x)?'selected':''}" onclick="atxToggle('dailyNeeds','${x}',this)">${x}</button>`).join('')}</div>`;
  if(s===5)html=`<div class="eyebrow">Step 6 · Your ranking lens</div><h1>What should carry the most weight?</h1><p class="lead">Every score remains explainable. Set how Atlas should prioritize the evidence—not what you’re supposed to value.</p><div class="weight-grid">${[['housing','Housing fit'],['safety','Public safety'],['mobility','Mobility & commute'],['market','Market fit'],['lifestyle','Daily life']].map(([k,l])=>`<div class="weight-card"><label>${l}</label><span id="weight_${k}">${m.rankWeights[k]}%</span><input id="w_${k}" type="range" min="0" max="50" value="${m.rankWeights[k]}" oninput="document.getElementById('weight_${k}').textContent=this.value+'%'"/></div>`).join('')}</div><p class="data-note">Public-safety measures are reported data, not predictions. Atlas shows source, year, coverage, and how each metric affects a rank.</p>`;
  if(s===6){let ready=baseReadiness();html=`<div class="eyebrow">Step 7 · Your all-in-one move studio</div><h1>Built around your real move.</h1><p class="lead">You’ll start with property tracking, a personalized area ranking lens, and the next decisions in the right order.</p><div class="setup-summary"><div><div class="eyebrow">${esc(m.housingIntent)} · ${esc(m.moveType)}</div><h3>${esc(m.origin||'Your starting point')} <span style="color:var(--leaf)">→</span> ${esc(m.destination||'Your next place')}</h3><div class="summary-list"><div><b>Homes</b> ${m.propertyTypes.join(' · ')}</div><div><b>Housing cap</b> ${money(m.housingMax)}/mo</div><div><b>Mobility</b> ${esc(m.commuteMode)} · ≤ ${m.commuteMinutes} min</div><div><b>Lens</b> ${Object.entries(m.rankWeights).sort((a,b)=>b[1]-a[1]).slice(0,2).map(x=>x[0]).join(' + ')}</div></div></div><div class="compass"><strong>${ready}%</strong><small>starting clarity</small></div></div><div class="source-banner" style="margin-top:16px"><div class="source-seal">i</div><div><b>Evidence, never a black box</b><p>Connect Census, HUD, FBI, and routing data from the Intelligence page. Your ranking will state what is current, what is missing, and why an area placed where it did.</p></div></div>`}root.innerHTML=`<main class="wizard"><aside class="wizard-aside"><div class="brand"><div class="brand-mark">M</div><div><div class="brand-name">Move Atlas</div><div class="brand-sub">Your relocation studio</div></div></div><h2>Plan the move around your life.</h2><p>Seven focused prompts. A workspace that knows what matters to you.</p><div class="steps">${ATX_STEPS.map((x,i)=>`<div class="step ${i===s?'current':''} ${i<s?'done':''}"><span class="dot">${i<s?'✓':i+1}</span>${x[0]}</div>`).join('')}</div><div class="wizard-note"><strong>Private by default.</strong>Your preferences and data keys stay in this browser in this standalone edition.</div></aside><section class="wizard-main"><div class="wizard-card">${html}<div class="wizard-actions"><div>${s?'<button class="button ghost" onclick="wizardBack()">← Back</button>':'<span class="step-count">Your tailored workspace</span>'}</div><div>${s===6?'<button class="button lime" onclick="finishSetup()">Open my move studio →</button>':'<button class="button" onclick="wizardNext()">Continue →</button>'}</div></div></div></section></main>`}
  function atxToggle(key,v,el){let a=state.move[key];if(!Array.isArray(a))a=state.move[key]=[];if(a.includes(v)){if(a.length===1)return showToast('Keep at least one option selected.');a.splice(a.indexOf(v),1)}else a.push(v);el.classList.toggle('selected');persist()}
  function saveWizardFields(){let m=state.move,s=state.wizardStep;if(s===0){m.person=document.getElementById('wPerson').value.trim();m.household=document.getElementById('wHousehold').value;m.pets=document.getElementById('wPets').value;m.moveType=document.getElementById('wMoveType').value}if(s===1){m.origin=document.getElementById('wOrigin').value.trim();m.destination=document.getElementById('wDestination').value.trim();m.date=document.getElementById('wDate').value;m.timeframe=document.getElementById('wTimeframe').value}if(s===2)m.housingIntent=document.getElementById('wIntent').value;if(s===3){m.housingMax=+document.getElementById('wHousing').value||0;m.savings=+document.getElementById('wSavings').value||0;m.moveFund=+document.getElementById('wFund').value||0;m.bedrooms=document.getElementById('wBeds').value;m.bathrooms=document.getElementById('wBaths').value;m.accessibility=document.getElementById('wAccess').value;m.budget[0].amount=m.moveFund}if(s===4){m.commuteMode=document.getElementById('wCommuteMode').value;m.commuteMinutes=+document.getElementById('wCommuteMinutes').value||30}if(s===5)['housing','safety','mobility','market','lifestyle'].forEach(k=>m.rankWeights[k]=+document.getElementById('w_'+k).value);persist()}
  function wizardNext(){if(state.wizardStep===0&&!document.getElementById('wPerson').value.trim())return showToast('Tell us what to call you first.');saveWizardFields();state.wizardStep++;renderWizard()}function wizardBack(){saveWizardFields();state.wizardStep--;renderWizard()}function finishSetup(){state.move.onboarded=true;atxCreateTasks();persist();render();showToast('Your personalized move studio is ready.')}
  function atxCreateTasks(){let m=state.move;if(m.tasks.some(x=>x.atx))return;let extra=[];if(m.housingIntent==='Rent'||m.housingIntent==='Temporary first')extra.push({id:id(),title:'Build your rental application packet',area:'Housing',when:'Next up',done:false,atx:true});if(m.housingIntent==='Buy'||m.housingIntent==='Explore both')extra.push({id:id(),title:'Clarify financing and a buying ceiling',area:'Housing',when:'Next up',done:false,atx:true});if(m.pets!=='No pets')extra.push({id:id(),title:'Check pet rules for top property types',area:'Housing',when:'Next up',done:false,atx:true});if(m.commuteMode!=='Flexible')extra.push({id:id(),title:'Test daily travel from your top areas',area:'Mobility',when:'Before moving',done:false,atx:true});m.tasks.push(...extra)}
  function areaRank(a){let m=state.move,o=a.official||{},w=m.rankWeights;let housing=o.hud?.score??o.census?.housingScore??a.localScore??50,safety=o.fbi?.score??a.localScore??50,mobility=o.mobility?.score??o.census?.mobilityScore??a.localScore??50,market=o.market?.score??a.localScore??50,lifestyle=a.localScore??50;let raw=housing*w.housing+safety*w.safety+mobility*w.mobility+market*w.market+lifestyle*w.lifestyle,den=w.housing+w.safety+w.mobility+w.market+w.lifestyle;return atxClamp(raw/(den||1))}
  function dataCoverage(a){let o=a.official||{},points=[o.census,o.hud,o.fbi,o.mobility,o.market].filter(Boolean).length;return points*20}
  function navItems(){let n=[['dashboard','home','Overview'],['profile','profile','My move'],['roadmap','roadmap','Roadmap'],['intelligence','areas','Area intelligence'],['housing','housing','Homes & rentals'],['budget','budget','Budget']];if(state.move.priorities.includes('Career'))n.push(['career','career','Career']);n.push(['documents','docs','Documents']);return n}
  function renderApp(){normalizeMove(state.move);let m=state.move,active=state.section,ready=baseReadiness(),first=(m.person||state.account.name||'there').split(' ')[0];if(!navItems().some(x=>x[0]===active))active=state.section='dashboard';root.innerHTML=`<div class="app"><aside class="sidebar"><div class="brand"><div class="brand-mark">M</div><div><div class="brand-name">Move Atlas</div><div class="brand-sub">Relocation studio</div></div></div><div class="workspace">Your workspace</div><nav class="nav">${navItems().map(([s,i,l])=>`<button class="${s===active?'active':''}" onclick="go('${s}')"><span class="nav-icon">${icons[i]}</span>${l}</button>`).join('')}</nav><div class="side-bottom"><div class="readiness-mini"><header><span>Move readiness</span><b>${ready}%</b></header><div class="meter"><i style="width:${ready}%"></i></div></div><div class="account-menu"><div class="avatar">${initials(state.account.name)}</div><div class="who"><b>${esc(state.account.name)}</b><span>${esc(state.account.email)}</span></div><button title="Sign out" onclick="signOut()">↗</button></div></div></aside><main class="main"><header class="topbar"><div class="mobile-brand brand"><div class="brand-mark">M</div><div class="brand-name">Move Atlas</div></div><div class="crumb">${active==='dashboard'?'Your relocation studio':navItems().find(x=>x[0]===active)[2]}</div><div class="top-actions"><span class="help">Every score has a source.</span><button class="button small secondary" onclick="openQuickAdd()">＋ Add</button></div></header><div class="page">${page(active,first,ready)}</div></main><nav class="mobile-nav">${navItems().slice(0,5).map(([s,i,l])=>`<button class="${s===active?'active':''}" onclick="go('${s}')"><span>${icons[i]}</span>${l}</button>`).join('')}</nav></div>`}
  function page(s,first,ready){let p={dashboard:dashboardPage(first,ready),profile:profilePage(),roadmap:roadmapPage(),intelligence:intelligencePage(),housing:housingPage(),budget:budgetPage(),career:collectionPage('career','Career','Keep income and opportunity visible as your move takes shape.','Add opportunity'),documents:collectionPage('documents','Documents','The invisible details, stored where you can find them.','Add document')};return `<section class="section active">${p[s]||p.dashboard}</section>`}
  function dashboardPage(first,ready){let m=state.move,ranked=[...m.areas].sort((a,b)=>areaRank(b)-areaRank(a)),top=ranked[0],done=m.tasks.filter(x=>x.done).length,days=m.date?Math.max(0,Math.ceil((new Date(m.date+'T12:00:00')-Date.now())/86400000)):null;return`<div class="page-head"><div><div class="eyebrow">${greeting()}, ${esc(first)}</div><h1>Your move, organized around real life.</h1><p>A private all-in-one workspace for the places, property options, evidence, money, and next actions that make a move feel possible.</p></div></div><section class="dashboard-hero"><div><div class="eyebrow">Your move at a glance</div><h2>${esc(m.origin||'Your current home')} <span style="color:var(--lime)">→</span> ${esc(m.destination||'a place to discover')}</h2><p>${m.housingIntent} · ${m.propertyTypes.slice(0,2).join(' + ')} · ${m.date?dateText(m.date):m.timeframe}</p><div class="route"><span>${esc(m.origin||'HERE')}</span><i class="line"></i><span>${esc(m.destination||'NEXT')}</span></div></div><div class="hero-right"><div class="ready-label">Move readiness</div><div class="readiness-big"><b>${ready}%</b><span>of your plan<br>is taking shape</span></div><div class="meter"><i style="width:${ready}%"></i></div><div class="tip"><strong>${top?`Leading area: ${esc(top.name)}.`:'Start your shortlist:'}</strong> ${nextTip()}</div></div></section><section class="dashboard-grid"><article class="card"><div class="card-head"><div><h3>Your next decisive moves</h3><p>Chosen for your property path and daily-life needs.</p></div><button class="quiet-link" onclick="go('roadmap')">View roadmap →</button></div><div class="next-list">${m.tasks.slice(0,4).map((t,i)=>`<div class="next ${t.done?'done':''}"><div class="status-dot">${t.done?'✓':i+1}</div><div><strong>${esc(t.title)}</strong><span>${esc(t.area)} · ${esc(t.when)}</span></div><button onclick="toggleTask('${t.id}')">${t.done?'Reopen':'Complete'}</button></div>`).join('')}</div></article><aside class="card"><div class="card-head"><div><h3>Your move guardrails</h3><p>Keep the options aligned with your needs.</p></div></div><div class="glance"><div class="metric"><label>Move fund</label><strong>${money(m.savings)}</strong><span>of ${money(m.moveFund)} saved</span></div><div class="metric"><label>Housing cap</label><strong>${money(m.housingMax)}</strong><span>per month</span></div><div class="metric"><label>Target</label><strong>${days!==null?days:'—'}</strong><span>${days!==null?'days away':m.timeframe}</span></div><div class="metric"><label>Area leader</label><strong>${top?areaRank(top):'—'}</strong><span>${top?esc(top.name):'Add areas to compare'}</span></div></div></aside></section><section class="priority-strip">${m.propertyTypes.slice(0,4).map((x,i)=>`<article class="priority"><div class="p-icon">${['⌂','▣','⌑','⌘'][i]}</div><b>${esc(x)}</b><span>${m.housingIntent} path · your tracker is ready</span></article>`).join('')}</section><section class="source-banner" style="margin-top:17px"><div class="source-seal">↗</div><div style="flex:1"><b>Atlas Intelligence is ready for your shortlist.</b><p>${m.areas.length?`${m.areas.length} area${m.areas.length===1?'':'s'} saved. Connect official data or add a verified source to improve coverage and ranking confidence.`:'Add your first area, then connect Census, HUD, FBI, and mobility data from the Intelligence page.'}</p></div><button class="button small" onclick="go('intelligence')">Open intelligence</button></section><section class="dashboard-grid"><article class="card"><div class="card-head"><div><h3>Decision horizon</h3><p>A sane sequence for the weeks ahead.</p></div></div><div class="timeline"><div class="timeline-item"><div class="when">NOW</div><div class="rail"></div><div><strong>Define your filters</strong><span>${m.propertyTypes.join(', ')} · ${m.bedrooms} beds · ${m.commuteMode}</span></div></div><div class="timeline-item"><div class="when">NEXT</div><div class="rail"></div><div><strong>Compare areas with evidence</strong><span>Source, year, coverage, and the exact score math stay visible.</span></div></div><div class="timeline-item"><div class="when">THEN</div><div class="rail"></div><div><strong>Choose the right landing</strong><span>Keep property, budget, logistics, and documents together.</span></div></div></div></article><aside class="card"><div class="card-head"><div><h3>A note from your atlas</h3></div></div><p style="font:600 23px/1.25 var(--serif);letter-spacing:-.03em;margin:0">“A good move is less about finding the perfect answer, and more about making a choice you can stand behind.”</p><p style="font-size:12px;color:var(--muted);margin:14px 0 0">You have ${done} of ${m.tasks.length} foundational actions complete.</p></aside></section>`}
  function profilePage(){let m=state.move;return`<div class="page-head"><div><div class="eyebrow">Your north star</div><h1>My move</h1><p>The living brief behind the workspace and the area ranking.</p></div><button class="button secondary" onclick="editProfile()">Edit move brief</button></div><div class="profile-layout"><article class="card"><div class="card-head"><div><h3>Your move brief</h3><p>These facts filter every option you save.</p></div></div>${[['Moving from',m.origin||'Not set'],['Moving toward',m.destination||'Still exploring'],['Move type',m.moveType],['Household',m.household],['Property path',m.housingIntent],['Property types',m.propertyTypes.join(' · ')],['Home needs',`${m.bedrooms} beds · ${m.bathrooms} baths · ${m.pets}`],['Mobility',`${m.commuteMode} · up to ${m.commuteMinutes} min`],['Housing ceiling',money(m.housingMax)+'/mo'],['Move fund',money(m.moveFund)]].map(x=>`<div class="info-row"><label>${x[0]}</label><b>${esc(x[1])}</b></div>`).join('')}</article><aside class="card"><div class="card-head"><div><h3>Your ranking lens</h3><p>The transparent weights used for area scores.</p></div></div>${Object.entries(m.rankWeights).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="feature-row"><span>${esc({housing:'Housing fit',safety:'Public safety',mobility:'Mobility & commute',market:'Market fit',lifestyle:'Daily life'}[k])}</span><b>${v}%</b></div>`).join('')}<div class="data-note">Change these by restarting setup from the profile editor in a future connected build; this standalone edition lets you edit the move brief and ranking inputs directly.</div></aside></div>`}
  function intelligencePage(){return`<div class="page-head"><div><div class="eyebrow">Public prototype</div><h1>Area intelligence is preparing.</h1><p>The complete disclosure-first area module has not loaded yet. Reload the page before using this section.</p></div></div><div class="source-banner"><div class="source-seal">i</div><div><b>No provider keys or tokens are accepted.</b><p>This fallback screen intentionally withholds rankings and data claims until the full prototype module is available.</p></div></div>`}
  function areaCard(a,i){let o=a.official,rank=areaRank(a),cov=dataCoverage(a),m=state.move;let values=[['Housing',o.hud?.score??o.census?.housingScore,'fit'],['Safety',o.fbi?.score,'reported'],['Mobility',o.mobility?.score??o.census?.mobilityScore,'fit'],['Market',o.market?.score,'fit'],['Life',a.localScore,'your rating']];return`<article class="rank-card"><div class="rank-num">${i+1}</div><div><div class="rank-name">${esc(a.name)}</div><div class="rank-place">${esc(a.region||'Location details needed')}</div><div class="rank-meta">${o.census?'<span class="pill">Census synced</span>':''}${o.hud?'<span class="pill">HUD added</span>':''}${o.fbi?'<span class="pill">FBI added</span>':''}${o.mobility?'<span class="pill">Route added</span>':''}${!o.census&&!o.hud&&!o.fbi&&!o.mobility?'<span class="pill warm">Needs evidence</span>':''}</div><div class="metric-lines">${values.map(([l,v,q])=>`<div class="metric-line"><span>${l}</span><b>${v===undefined?'—':atxClamp(v)}<small style="font-size:9px;color:var(--muted);font-weight:400"> ${v===undefined?'':'/100'}</small></b></div>`).join('')}</div></div><div class="rank-score"><b>${rank}</b><small>weighted fit score</small><div class="coverage"><span>${cov}% data coverage</span><div class="progress"><i style="width:${cov}%"></i></div></div></div></article>`}
  function housingPage(){let m=state.move,arr=m.housing;return`<div class="page-head"><div><div class="eyebrow">Every kind of place</div><h1>Homes & rentals</h1><p>Keep apartments, condos, townhomes, houses, co-living, temporary stays, and build paths in one calm shortlist.</p></div><button class="button" onclick="openRecord('housing')">＋ Add property</button></div><div class="source-banner"><div class="source-seal">⌂</div><div><b>Your current search: ${esc(m.housingIntent)} · ${esc(m.propertyTypes.join(' · '))}</b><p>${m.bedrooms} bedrooms · ${m.bathrooms} baths · ${m.pets} · ${m.accessibility}. Every saved property is checked against this brief.</p></div></div>${arr.length?`<div class="data-grid">${arr.map(x=>`<article class="data-card"><div class="housing-kind">${esc(x.intent)} · ${esc(x.propertyType)}</div><div class="card-head"><div><h3>${esc(x.name)}</h3><p>${esc(x.detail||'Saved for review')}</p></div><span class="pill">${x.price?esc(x.price):'Review'}</span></div><div class="feature-list"><div class="feature-row"><span>Layout</span><b>${esc(x.beds||'—')} beds · ${esc(x.baths||'—')} baths</b></div><div class="feature-row"><span>Commute</span><b>${esc(x.commute||'Add route')}</b></div><div class="feature-row"><span>Match</span><b>${x.score?`${x.score}/100`:'To assess'}</b></div></div><button class="quiet-link" style="margin-top:15px" onclick="deleteRecord('housing','${x.id}')">Remove</button></article>`).join('')}</div>`:`<div class="card empty-state"><span class="empty-icon">⌂</span><h3>Bring every possibility together.</h3><p>Whether you’re renting an apartment, buying a condo, comparing townhomes, or planning a temporary stay, save it here.</p><button class="button small" style="margin-top:12px" onclick="openRecord('housing')">Add a property</button></div>`}`}

    const r=C.selected(),t=state.move.travel,w=C.warnings(r),station=C.fuelStations(r)[0],day=state.move.routePlan.itineraryDays[0];document.body.insertAdjacentHTML('beforeend',`<section class="moving-mode" id="movingMode" aria-label="Moving Day travel mode"><header class="moving-top"><div class="brand"><div class="brand-mark">M</div><div><div class="brand-name">Moving Day</div><div class="brand-sub">Route command</div></div></div><div class="moving-top-actions"><button class="button small secondary" onclick="RouteUI.voice()">◉ Voice placeholder</button><button class="button small secondary" onclick="RouteUI.closeMovingMode()">Exit</button></div></header><main class="moving-body"><div class="driver-warning">Drivers: do not interact while the vehicle is moving. Pull over safely or hand the app to a passenger.</div><label style="display:flex;gap:9px;align-items:center;margin:13px 0;font-size:12px"><input type="checkbox" style="width:auto" onchange="RouteUI.passenger(this.checked)"> I’m a passenger and can operate planning controls</label><section class="moving-next"><label>Next planned stop · mock itinerary</label><h1>${esc(station.name)}</h1><p>${station.mile} route miles · expected ${day?.events?.find(x=>x.type==='fuel')?.time||'—'} · verify access and hours</p></section><section class="moving-stat-grid"><article class="moving-stat"><label>Distance to fuel</label><b>${station.mile} mi</b></article><article class="moving-stat"><label>Modeled fuel remaining</label><b>${Math.max(t.fuel.reservePercent+8,42)}%</b></article><article class="moving-stat"><label>Hotel arrival</label><b>${day?.events?.slice(-1)[0]?.time||'—'}</b></article><article class="moving-stat"><label>Route data</label><b>Mock / 18%</b></article></section><section class="moving-critical">${w.slice(0,3).map(a=>`<div class="moving-alert ${a.level}"><div class="icon">${a.level==='high'?'!':'i'}</div><div><strong>${esc(a.title)} · ${a.status.toUpperCase()}</strong><p>${esc(a.detail)}</p></div></div>`).join(   openQuickAdd=function(){modal('Add to your workspace',`<div class="choice-grid"><div class="choice" onclick="closeModal();openTask()"><span class="choice-icon">✓</span><strong>Action</strong><span>Add a roadmap task</span></div><div class="choice" onclick="closeModal();openBudget()"><span class="choice-icon">$</span><strong>Budget line</strong><span>Capture a cost</span></div><div class="choice" onclick="closeModal();openRecord('areas')"><span class="choice-icon">⌖</span><strong>Area</strong><span>Save a contender</span></div><div class="choice" onclick="closeModal();openRecord('housing')"><span class="choice-icon">⌂</span><strong>Property</strong><span>Keep a listing</span></div><div class="choice" onclick="closeModal();go('route')"><span class="choice-icon">⇢</span><strong>Route plan</strong><span>Open trip command</span></div></div>`)};

    advanceAddress(a){const x=state.move.operations.address.find(v=>v.id===a),s=['not-started','in-progress','complete'];x.status=s[(s.indexOf(x.status)+1)%s.length];persist();renderApp()},toggleSettling(s){const x=state.move.operations.settling.find(v=>v.id===s);x.done=!x.done;persist();renderApp()},
    setDocCategory(c){ui.docCategory=c;renderApp()},cycleDocument(docId){const x=state.move.documentChecklist.find(v=>v.id===docId),s=['missing','requested','ready','expired','not-applicable'];x.status=s[(s.indexOf(x.status)+1)%s.length];persist();renderApp()},addDocument(){modal('Add a custom document item',`<div class="field"><label>Name</label><input id="customDocName"></div><div class="field"><label>Status or reminder</label><input id="customDocDetail" placeholder="Metadata only—do not paste sensitive contents"></div><button class="button full" onclick="ProductUI.saveDocument()">Add checklist item</button>`)},saveDocument(){const n=document.getElementById('customDocName').value.trim();if(!n)return showToast('Add a document name.');state.move.documents.push({id:id(),name:n,detail:document.getElementById('customDocDetail').value.trim()});persist();closeModal();renderApp()},
    openAssistant(){modal('Atlas assistant',`${assistantThread()}<div class="assistant-compose"><textarea id="assistantDrawerInput" aria-label="Ask Atlas" placeholder="What should I do next?"></textarea><button class="button" onclick="ProductUI.send('assistantDrawerInput')">Send</button></div><div class="assistant-prompts" style="margin-top:12px"><button onclick="ProductUI.quickAssistant('next')">What should I do next?</button><button onclick="ProductUI.quickAssistant('areas')">Explain my area ranking</button><button onclick="ProductUI.quickAssistant('route')">Review my road-trip plan</button></div><p class="data-note">Local planning guidance. Critical information remains tied to its official source.</p>`)},
    send(inputId){const el=document.getElementById(inputId),text=el?.value.trim();if(!text)return;state.move.assistant.messages.push({role:'user',text,label:'You'});const r=assistantResponse(text);state.move.assistant.messages.push({role:'assistant',...r,label:'Local planning guidance'});persist();if(document.getElementById('modalBack'))this.openAssistant();else renderApp()},quickAssistant(kind){const prompts={next:'What should I do next?',areas:'Explain my area ranking.',budget:'Pressure-test my moving budget.',route:'Review my route plan.',packing:'What should I pack first?',settling:'Help with my first 30 days.'},text=prompts[kind]||kind;state.move.assistant.messages.push({role:'user',text,label:'You'});const r=assistantResponse(text);state.move.assistant.messages.push({role:'assistant',...r,label:'Local planning guidance'});persist();if(document.getElementById('modalBack'))this.openAssistant();else{state.section='assistant';renderApp()}},taskFromMessage(i){const x=state.move.assistant.messages[i];if(!x?.task)return;state.move.tasks.push({id:id(),title:x.task,area:'Atlas assistant',when:'Next up',done:false});persist();renderApp();showToast('Suggested task added to your roadmap.')},
    more(){const items=navItems().filter(x=>!['dashboard','roadmap','route','tools'].includes(x[0]));modal('More of your move',`<div class="more-sheet">${items.map(([s,i,l])=>`<button onclick="closeModal();go('${s}')"><span>${icons[i]}</span>${esc(l)}</button>`).join('')}</div>`)},
    newMove(){modal('Create another move plan',`<div class="field"><label>Plan name</label><input id="newMoveName" placeholder="e.g. Denver possibility"></div><button class="button full" onclick="ProductUI.saveNewMove()">Create guided plan</button>`)},saveNewMove(){const name=document.getElementById('newMoveName').value.trim()||'New move';ensureLibrary();const move=defaultMove(),plan={id:`move-${id()}`,name,move};state.account.moveLibrary.find(x=>x.id===state.account.activeMoveId).move=state.move;state.account.moveLibrary.push(plan);state.account.activeMoveId=plan.id;state.move=move;state.section='dashboard';state.wizardStep=0;persist();closeModal();render()},switchMove(planId){ensureLibrary();const current=state.account.moveLibrary.find(x=>x.id===state.account.activeMoveId);if(current)current.move=state.move;const plan=state.account.moveLibrary.find(x=>x.id===planId);if(!plan)return;state.account.activeMoveId=plan.id;state.move=plan.move;productNormalize(state.move);state.section='dashboard';persist();render()},consent(v){state.account.personalization=!!v;persist();showToast(v?'Personalized workspace enabled.':'Personalization disabled; your saved answers remain editable.')},
    exportData(){const safe=JSON.parse(JSON.stringify(state.account));delete safe.password;delete safe.passwordHash;delete safe.passwordSalt;const blob=new Blob([JSON.stringify(safe,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`move-atlas-${slug(state.account.name)||'export'}.json`;a.click();URL.revokeObjectURL(url);showToast('Local test export created.')},deleteAccount(){if(!confirm('Delete this local Move Atlas test profile and every move plan saved with it? There is no cloud recovery.'))return;saveAccounts(accounts().filter(a=>a.id!==state.account.id));localStorage.removeItem(SESSION_KEY);state.account=null;state.move=null;state.section='dashboard';render()},
    createFromDemo(){localStorage.removeItem(SESSION_KEY);state.account=null;state.move=null;state.section='dashboard';state.wizardStep=0;state.authMode='signup';renderAuth()},
    forgot(){authError('No password recovery exists for browser-local test profiles. Delete site data to reset the prototype.')},guest(){const all=accounts();let a=all.find(x=>x.email==='guest@device.local');if(!a){a={id:id(),name:'Guest',email:'guest@device.local',personalization:true,move:defaultMove()};all.push(a);saveAccounts(all)}state.account=a;state.move=a.move;ensureLibrary();localStorage.setItem(SESSION_KEY,JSON.stringify({id:a.id}));render()},social(name){authError(`${name} sign-in is not connected in this public prototype. Use a local test profile, guest profile, or the curated demo.`)}
  };

  window.ProductUI=ProductUI;
  window.MoveAtlasProduct=Object.freeze({version:'1.0.0-public-test',sources:SOURCE_DEFS,cache:AREA_CACHE,ensure:productNormalize,metrics:metricSet});
  if(state?.move)productNormalize(state.move);
  if(state?.account&&state?.move){ensureLibrary();persist();if(state.move.onboarded)renderApp();else render()}else renderAuth();
})();
